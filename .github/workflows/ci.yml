name: CI

# Unit tests on pull requests and by hand. Ordinary pushes to main do not run it; only
# /cf-ship --action dispatches it on the release commit (the default local release runs the unit
# tests on this Mac). Integration suites stay off (SKIP_INTEGRATION_TESTS); they need the local
# PostgreSQL container.

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dblore/**'
      - 'DbloreTests/**'
      - 'Dblore.xcodeproj/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR (or to main) cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      # Reuses the resolved packages and compiled mlx-swift objects. Keyed on Package.resolved and
      # the Xcode version; the restore key falls back to the latest cache when either changes.
      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-debug-${{ hashFiles('.xcode-version', 'Dblore.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: derived-debug-

      # mlx-swift compiles Metal shaders (default.metallib); the toolchain is a separate download.
      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # -skipPackagePluginValidation: mlx-swift ships a build plugin (CudaBuild) that otherwise
      # needs interactive trust. -skipMacroValidation: same for mlx-swift-lm macros.
      # Both skip flags are global to the invocation; -disableAutomaticPackageResolution and
      # -onlyUsePackageVersionsFromResolvedFile restrict the build to the committed Package.resolved.
      # The result bundle lives under RUNNER_TEMP so a failed run can upload it.
      - name: Test
        run: |
          SKIP_INTEGRATION_TESTS=true xcodebuild test \
            -scheme Dblore \
            -destination 'platform=macOS,arch=arm64' \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RUNNER_TEMP/Dblore.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: xcresult-${{ github.sha }}
          path: ${{ runner.temp }}/Dblore.xcresult
          retention-days: 7
