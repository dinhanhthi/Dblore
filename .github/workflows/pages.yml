name: Deploy website

# Publishes the landing site (website/) AND appcast.xml to GitHub Pages
# (https://dinhanhthi.github.io/Dblore/, appcast at /appcast.xml).
# Both are staged together because each Pages deploy replaces the whole site: deploying only one
# would delete the other (the app's SUFeedURL points at /appcast.xml).
# Nothing else in the repo is published.
# Requires Settings > Pages > Source = "GitHub Actions".
# scripts/release-local.sh pushes the new appcast.xml to main, which triggers this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'appcast.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Stage site
        run: |
          mkdir -p _site
          cp -R website/. _site/
          cp appcast.xml _site/appcast.xml
          for f in _site/index.html _site/appcast.xml; do
            [ -f "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
