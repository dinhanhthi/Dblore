name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: xcode-27
    steps:
      - name: Require a version tag
        env:
          REF: ${{ github.ref }}
        run: |
          if ! [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release must run from a vX.Y.Z tag, got $REF"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi
          awk -v heading="## v$version" '
            found && /^## / { exit }
            found { print }
            $0 == heading || index($0, heading " ") == 1 { found = 1 }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no non-empty '## v$version' section"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/developer_id.p12"
          keychain="$RUNNER_TEMP/release.keychain-db"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Write notarization API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: NOTARY_KEY_PATH="$RUNNER_TEMP/notary_key.p8" scripts/build-release.sh --expect-version "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/SQLNotebook-$version.dmg"
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" \
            --title "SQLNotebook $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      # Use the tools from the Sparkle SPM artifact the build already resolved (checksum-verified
      # by SPM, same version as the app) rather than an unverified download: this binary gets the
      # private signing key.
      - name: Locate Sparkle tools
        run: |
          ga=$(find ~/Library/Developer/Xcode/DerivedData -path '*/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast' -type f 2>/dev/null | head -1)
          if [[ -z "$ga" ]]; then
            echo "::error::generate_appcast not found in the Sparkle SPM artifact"
            exit 1
          fi
          echo "GENERATE_APPCAST=$ga" >> "$GITHUB_ENV"

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          archives="$RUNNER_TEMP/appcast"
          mkdir -p "$archives"
          # Start from the feed on main so previous items are kept.
          git fetch --no-tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git show FETCH_HEAD:appcast.xml > "$archives/appcast.xml"
          # DMG only, no release-notes .md: keeps the in-app update dialog compact.
          cp "dist/SQLNotebook-$version.dmg" "$archives/"
          # Key via stdin: the default keychain path blocks on a prompt on a headless runner.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" "$archives" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/$GITHUB_REF_NAME/" \
            --full-release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases"
          if ! grep -q "<sparkle:shortVersionString>$version</sparkle:shortVersionString>" "$archives/appcast.xml"; then
            echo "::error::appcast.xml has no item for $version"
            exit 1
          fi
          if ! grep -q 'sparkle:edSignature=' "$archives/appcast.xml"; then
            echo "::error::appcast.xml has no EdDSA signature"
            exit 1
          fi

      - name: Commit appcast to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The run is checked out at the tag and main may have moved: work on a fresh main.
          git fetch --no-tags "$repo_url" main
          git checkout --force --detach FETCH_HEAD
          cp "$RUNNER_TEMP/appcast/appcast.xml" appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- appcast.xml; then
            echo "appcast unchanged"
          else
            git add appcast.xml
            git commit -m "chore(release): appcast v$version"
            git push "$repo_url" HEAD:main
          fi

      - name: Deploy appcast to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushes made with GITHUB_TOKEN do not trigger other workflows, but workflow_dispatch does.
        run: gh workflow run deploy-appcast.yml --ref main -R "$GITHUB_REPOSITORY"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary_key.p8" "$RUNNER_TEMP/developer_id.p12"
          rm -rf "$RUNNER_TEMP/appcast"
