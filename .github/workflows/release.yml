name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Require a version tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/tags/v* ]]; then
            echo "::error::Release must run from a v* tag, got $REF"
            exit 1
          fi

      - name: Select Xcode with the macOS 26 SDK
        run: |
          best="" best_sdk=""
          for xcode in /Applications/Xcode*.app; do
            [[ -d "$xcode" ]] || continue
            sdk=$(DEVELOPER_DIR="$xcode/Contents/Developer" xcrun --sdk macosx --show-sdk-version 2>/dev/null || true)
            echo "$xcode: macOS SDK ${sdk:-none}"
            [[ -n "$sdk" && "${sdk%%.*}" -ge 26 ]] || continue
            if [[ -z "$best" ]] || [[ "$(printf '%s\n%s\n' "$best_sdk" "$sdk" | sort -V | tail -1)" == "$sdk" ]]; then
              best="$xcode" best_sdk="$sdk"
            fi
          done
          if [[ -z "$best" ]]; then
            echo "::error::No Xcode with macOS SDK >= 26 found in /Applications"
            exit 1
          fi
          echo "Selecting $best (macOS SDK $best_sdk)"
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi
          awk -v heading="## v$version" '
            found && /^## / { exit }
            found { print }
            $0 == heading || index($0, heading " ") == 1 { found = 1 }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no non-empty '## v$version' section"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/developer_id.p12"
          keychain="$RUNNER_TEMP/release.keychain-db"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Write notarization API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: NOTARY_KEY_PATH="$RUNNER_TEMP/notary_key.p8" scripts/build-release.sh --expect-version "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/SQLNotebook-$version.dmg"
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-rc* || "$GITHUB_REF_NAME" == *-beta* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" \
            --title "SQLNotebook $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $prerelease

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary_key.p8" "$RUNNER_TEMP/developer_id.p12"
