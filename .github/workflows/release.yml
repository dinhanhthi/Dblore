name: Release

# Not used by default: /cf-ship releases locally with scripts/release-local.sh.
# Only /cf-ship --action dispatches this (for example from another machine).

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit SHA to release
        required: true
        type: string
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: xcode-27
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release request
        env:
          REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "::error::Release must run from main, got $REF"
            exit 1
          fi
          # macOS runners ship Bash 3.2, which has no ${var,,}.
          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || [[ "$expected" != "$GITHUB_SHA" ]]; then
            echo "::error::expected_sha must match the dispatched commit $GITHUB_SHA"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vX.Y.Z"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      # Reuses the resolved packages and compiled mlx-swift objects (Release config, separate from
      # the CI cache). The Sparkle tools step below reads from this same DerivedData.
      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-release-${{ hashFiles('.xcode-version', 'Dblore.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: derived-release-

      - name: Preflight release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set"
            exit 1
          fi
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          existing=$(git ls-remote "$repo_url" "refs/tags/$TAG")
          if [[ -n "$existing" ]]; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          successful_ci=$(gh run list --workflow=ci.yml --commit="$GITHUB_SHA" \
            --status=success --limit=1 --json headSha --jq '.[0].headSha // ""')
          if [[ "$successful_ci" != "$GITHUB_SHA" ]]; then
            echo "::error::No successful ci.yml run found for $GITHUB_SHA"
            exit 1
          fi
          # Read the pbxproj directly: xcodebuild here (before the Metal toolchain download) hung.
          project_version=$(awk -F' = ' '/^[[:space:]]*MARKETING_VERSION = / { gsub(/[;"]/, "", $2); print $2 }' \
            Dblore.xcodeproj/project.pbxproj | sort -u | paste -sd ' ' -)
          if [[ "$project_version" != "$VERSION" ]]; then
            echo "::error::MARKETING_VERSION is ${project_version:-missing}, expected $VERSION"
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi
          awk -v heading="## $TAG" '
            found && /^## / { exit }
            found { print }
            $0 == heading || index($0, heading " ") == 1 { found = 1 }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no non-empty '## $TAG' section"
            exit 1
          fi

      # mlx-swift compiles Metal shaders (default.metallib); the toolchain is a separate download.
      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/developer_id.p12"
          keychain="$RUNNER_TEMP/release.keychain-db"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Write notarization API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: NOTARY_KEY_PATH="$RUNNER_TEMP/notary_key.p8" scripts/build-release.sh --expect-version "$VERSION"

      # Use the tools from the Sparkle SPM artifact the build already resolved (checksum-verified
      # by SPM, same version as the app) rather than an unverified download: this binary gets the
      # private signing key.
      - name: Locate Sparkle tools
        run: |
          ga=$(find ~/Library/Developer/Xcode/DerivedData -path '*/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast' -type f 2>/dev/null | head -1)
          if [[ -z "$ga" ]]; then
            echo "::error::generate_appcast not found in the Sparkle SPM artifact"
            exit 1
          fi
          echo "GENERATE_APPCAST=$ga" >> "$GITHUB_ENV"

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set"
            exit 1
          fi
          archives="$RUNNER_TEMP/appcast"
          mkdir -p "$archives"
          # Start from the feed on main so previous items are kept.
          git fetch --no-tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git show FETCH_HEAD:appcast.xml > "$archives/appcast.xml"
          # DMG only, no release-notes .md: keeps the in-app update dialog compact.
          cp "dist/Dblore-$VERSION.dmg" "$archives/"
          # Key via stdin: the default keychain path blocks on a prompt on a headless runner.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" "$archives" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/" \
            --full-release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases"
          if ! grep -q "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" "$archives/appcast.xml"; then
            echo "::error::appcast.xml has no item for $VERSION"
            exit 1
          fi
          if ! grep -q 'sparkle:edSignature=' "$archives/appcast.xml"; then
            echo "::error::appcast.xml has no EdDSA signature"
            exit 1
          fi

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main may have moved during the build; the built SHA only has to still be on it.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          if [[ "$status" != ahead && "$status" != identical ]]; then
            echo "::error::$GITHUB_SHA is no longer on main ($status); refusing to tag"
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="dist/Dblore-$VERSION.dmg"
          gh release create "$TAG" "$dmg" "$dmg.sha256" \
            --title "Dblore $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Commit appcast to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Main may have moved since dispatch: work on a fresh main.
          git fetch --no-tags "$repo_url" main
          git checkout --force --detach FETCH_HEAD
          cp "$RUNNER_TEMP/appcast/appcast.xml" appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- appcast.xml; then
            echo "appcast unchanged"
          else
            git add appcast.xml
            git commit -m "chore(release): appcast v$VERSION"
            git push "$repo_url" HEAD:main
          fi

      - name: Deploy website and appcast to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushes made with GITHUB_TOKEN do not trigger other workflows, but workflow_dispatch does.
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary_key.p8" "$RUNNER_TEMP/developer_id.p12"
          rm -rf "$RUNNER_TEMP/appcast"
