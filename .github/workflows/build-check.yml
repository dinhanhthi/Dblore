name: Build check

# Compiles the app exactly like release.yml (Release archive, both architectures, pinned Xcode)
# on every push to main, without signing. /cf-ship tags a commit only after this run is green
# for that exact SHA, so a toolchain difference with the local Xcode never reaches a tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.sha }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      # mlx-swift compiles Metal shaders (default.metallib); the toolchain is a separate download.
      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # -skipPackagePluginValidation: mlx-swift ships a build plugin (CudaBuild) that otherwise
      # needs interactive trust. -skipMacroValidation: same for mlx-swift-lm macros.
      # Both skip flags are global to the invocation; -disableAutomaticPackageResolution and
      # -onlyUsePackageVersionsFromResolvedFile restrict the build to the committed Package.resolved.
      - name: Archive (Release, unsigned)
        run: |
          xcodebuild archive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -project Dblore.xcodeproj \
            -scheme Dblore \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Dblore.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
