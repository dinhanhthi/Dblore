name: dblore-ssh

# PostgreSQL reachable only through an SSH tunnel. Generate fixtures first:
#   docker/postgresql/scripts/gen-ssh-fixtures.sh
# sshd (ed25519 host key): 127.0.0.1:${SSH_TUNNEL_PORT:-2222}
# sshd (RSA-only host key): 127.0.0.1:${SSH_TUNNEL_RSA_PORT:-2223}
# User dblore: password dblore-ssh-123 or the ed25519/ecdsa/encrypted ed25519 keys.
# Tunnel target: postgres:5432 (db dblore_ssh, user dblore_ssh, password dblore123),
# TLS optional with the self-signed data/ssh/postgres/server.crt (CN/SAN postgres).
# Tunnel target: mysql-ssh:3306 (MySQL 8.4; db dblore_ssh, user dblore_ssh, password
# dblore123, caching_sha2_password; root password dblore123), TLS optional with
# data/ssh/mysql/server.crt (CN/SAN DNS:mysql-ssh) issued by data/ssh/ca.crt.
# Tunnel target: mongo-ssh:27017 (MongoDB 8.0 standalone; user root, password dblore123,
# authSource admin), preferTLS with data/ssh/mongo/server.pem (CN/SAN DNS:mongo-ssh)
# issued by data/ssh/ca.crt. Neither target publishes a port: only sshd reaches them.

x-sshd: &sshd
  build:
    context: .
    dockerfile_inline: |
      FROM alpine:3.20
      RUN apk add --no-cache openssh-server \
        && adduser -D -s /bin/sh dblore \
        && echo 'dblore:dblore-ssh-123' | chpasswd
  image: dblore-sshd:alpine3.20
  volumes:
    - ./data/ssh:/fixtures:ro
  entrypoint: ["/bin/sh", "-ec"]
  command:
    - |
      cp "/fixtures/$${HOST_KEY}" /etc/ssh/host_key
      chmod 600 /etc/ssh/host_key
      mkdir -p /home/dblore/.ssh
      cp /fixtures/authorized_keys /home/dblore/.ssh/authorized_keys
      chown -R dblore:dblore /home/dblore/.ssh
      chmod 700 /home/dblore/.ssh
      chmod 600 /home/dblore/.ssh/authorized_keys
      cat > /etc/ssh/sshd_config <<'CONF'
      Port 22
      HostKey /etc/ssh/host_key
      PermitRootLogin no
      PubkeyAuthentication yes
      PasswordAuthentication yes
      KbdInteractiveAuthentication no
      AuthorizedKeysFile .ssh/authorized_keys
      AllowTcpForwarding yes
      GatewayPorts no
      X11Forwarding no
      AllowUsers dblore
      CONF
      exec /usr/sbin/sshd -D -e
  healthcheck:
    test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
    interval: 2s
    timeout: 2s
    retries: 15
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - ssh_internal
    - ssh_public

services:
  postgres:
    image: postgres:16-alpine
    container_name: dblore-postgres-ssh
    hostname: postgres
    environment:
      POSTGRES_DB: dblore_ssh
      POSTGRES_USER: dblore_ssh
      POSTGRES_PASSWORD: dblore123
    volumes:
      - postgres_ssh_data:/var/lib/postgresql/data
      - ./data/ssh/postgres:/tls:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /tmp/dblore-ssh-tls
        cp /tls/server.crt /tls/server.key /tmp/dblore-ssh-tls/
        chown -R postgres:postgres /tmp/dblore-ssh-tls
        chmod 600 /tmp/dblore-ssh-tls/server.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/tmp/dblore-ssh-tls/server.crt \
          -c ssl_key_file=/tmp/dblore-ssh-tls/server.key
    networks:
      ssh_internal:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dblore_ssh -d dblore_ssh"]
      interval: 2s
      timeout: 2s
      retries: 15

  mysql-ssh:
    image: mysql:8.4
    container_name: dblore-mysql-ssh
    hostname: mysql-ssh
    environment:
      MYSQL_DATABASE: dblore_ssh
      MYSQL_USER: dblore_ssh
      MYSQL_PASSWORD: dblore123
      MYSQL_ROOT_PASSWORD: dblore123
    volumes:
      - mysql_ssh_data:/var/lib/mysql
      - ./data/ssh:/fixtures:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /fixtures/ca.crt ] || [ ! -f /fixtures/mysql/server.crt ] \
          || [ ! -f /fixtures/mysql/server.key ]; then
          echo "Missing MySQL TLS fixtures in docker/postgresql/data/ssh: run docker/postgresql/scripts/gen-ssh-fixtures.sh" >&2
          exit 1
        fi
        mkdir -p /tmp/dblore-ssh-tls
        cp /fixtures/ca.crt /fixtures/mysql/server.crt /fixtures/mysql/server.key /tmp/dblore-ssh-tls/
        chown -R mysql:mysql /tmp/dblore-ssh-tls
        chmod 600 /tmp/dblore-ssh-tls/server.key
        exec docker-entrypoint.sh mysqld \
          --ssl-ca=/tmp/dblore-ssh-tls/ca.crt \
          --ssl-cert=/tmp/dblore-ssh-tls/server.crt \
          --ssl-key=/tmp/dblore-ssh-tls/server.key
    networks:
      ssh_internal:
        aliases:
          - mysql-ssh
    healthcheck:
      # TCP ping fails while the init server runs socket-only.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 60

  mongo-ssh:
    image: mongo:8.0
    container_name: dblore-mongo-ssh
    hostname: mongo-ssh
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: dblore123
    volumes:
      - mongo_ssh_data:/data/db
      - ./data/ssh:/fixtures:ro
    # mongod 8.0 refuses TLS without --tlsCAFile (SERVER-72839);
    # --tlsAllowConnectionsWithoutCertificates keeps client certificates optional and
    # preferTLS keeps plain connections working next to TLS ones.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /fixtures/ca.crt ] || [ ! -f /fixtures/mongo/server.pem ]; then
          echo "Missing MongoDB TLS fixtures in docker/postgresql/data/ssh: run docker/postgresql/scripts/gen-ssh-fixtures.sh" >&2
          exit 1
        fi
        mkdir -p /tmp/dblore-ssh-tls
        cp /fixtures/ca.crt /fixtures/mongo/server.pem /tmp/dblore-ssh-tls/
        chown -R mongodb:mongodb /tmp/dblore-ssh-tls
        chmod 600 /tmp/dblore-ssh-tls/server.pem
        exec docker-entrypoint.sh mongod --tlsMode preferTLS \
          --tlsCertificateKeyFile /tmp/dblore-ssh-tls/server.pem \
          --tlsCAFile /tmp/dblore-ssh-tls/ca.crt --tlsAllowConnectionsWithoutCertificates
    networks:
      ssh_internal:
        aliases:
          - mongo-ssh
    healthcheck:
      # Pings the container hostname: the entrypoint's init mongod listens on 127.0.0.1 only,
      # so healthy means the root user exists.
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname)\" --eval 'db.runCommand({ping:1})'"]
      interval: 2s
      timeout: 5s
      retries: 60

  sshd:
    <<: *sshd
    container_name: dblore-sshd
    environment:
      HOST_KEY: ssh_host_ed25519_key
    ports:
      - "127.0.0.1:${SSH_TUNNEL_PORT:-2222}:22"

  sshd-rsa:
    <<: *sshd
    container_name: dblore-sshd-rsa
    environment:
      HOST_KEY: ssh_host_rsa_key
    ports:
      - "127.0.0.1:${SSH_TUNNEL_RSA_PORT:-2223}:22"

networks:
  ssh_internal:
    internal: true
  ssh_public:

volumes:
  postgres_ssh_data:
    name: dblore-postgres-ssh-data
  mysql_ssh_data:
    name: dblore-mysql-ssh-data
  mongo_ssh_data:
    name: dblore-mongo-ssh-data
