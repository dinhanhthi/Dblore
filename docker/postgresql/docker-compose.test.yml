services:
  postgres-test:
    image: postgres:16-alpine
    container_name: dblore-postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_DB: dblore_test
      POSTGRES_USER: dblore_test
      POSTGRES_PASSWORD: dblore123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"

    ports:
      - "5435:5432"

    volumes:
      # Persistent data for test database
      - postgres_test_data:/var/lib/postgresql/data
      # No initialization scripts for test DB - tests will create their own tables

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dblore_test -d dblore_test"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dblore-test

volumes:
  postgres_test_data:
    name: dblore-postgres-test-data

networks:
  dblore-test:
    name: dblore-test-network
