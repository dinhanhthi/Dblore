# Published port and names are overridable (DBLORE_PG_TEST_PORT, DBLORE_TEST_NAME_PREFIX) so
# scripts/ci-live-databases.sh can run a separate copy next to the local one.
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: ${DBLORE_TEST_NAME_PREFIX:-dblore}-postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_DB: dblore_test
      POSTGRES_USER: dblore_test
      POSTGRES_PASSWORD: dblore123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"

    ports:
      - "127.0.0.1:${DBLORE_PG_TEST_PORT:-5435}:5432"

    volumes:
      # Persistent data for test database
      - postgres_test_data:/var/lib/postgresql/data
      # No initialization scripts for test DB - tests will create their own tables

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dblore_test -d dblore_test"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dblore-test

volumes:
  postgres_test_data:
    name: ${DBLORE_TEST_NAME_PREFIX:-dblore}-postgres-test-data

networks:
  dblore-test:
    name: ${DBLORE_TEST_NAME_PREFIX:-dblore}-test-network
